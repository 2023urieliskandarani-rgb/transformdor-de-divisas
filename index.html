<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor y Sistema de Pegatinas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Conversor de Divisas & Pegatinas</h1>

    <!-- Sección 1: Conversor de Divisas -->
    <div class="card">
      <h2>Sección 1: Conversor de Divisas</h2>
      <div class="input-group">
        <label for="usdAmount">Monto en Dólares (USD):</label>
        <input type="number" id="usdAmount" value="100" placeholder="Ej. 100">
      </div>
      <div class="input-group">
        <label for="exchangeRate">Tipo de Cambio (ARS por USD):</label>
        <input type="number" id="exchangeRate" value="1200" placeholder="Ej. 1200">
      </div>
      <button onclick="calcularTodo()">Convertir y Calcular Pegatinas</button>

      <div class="result-box">
        Total en Pesos: <span id="pesoResult">$120.000</span> ARS
      </div>
    </div>

    <!-- Sección 2: Sistema de Pegatinas -->
    <div class="card">
      <h2>Sección 2: Sistema de Pegatinas</h2>
      <p class="info-text">Regla: 1 Pegatina cada $1.000 ARS</p>

      <div class="result-box highlight">
        Total de Pegatinas Ganadas: <span id="stickerResult">120</span> 🐱
      </div>

      <div id="stickerContainer" class="sticker-grid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
